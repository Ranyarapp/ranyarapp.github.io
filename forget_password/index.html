<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور - رانیار</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0D1B2A;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1B263B;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #94A3B8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #233047;
            color: #FFFFFF;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: #2563EB;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1E40AF;
        }
        .success {
            color: #10B981;
            font-size: 14px;
            margin-top: 10px;
        }
        .error {
            color: #EF4444;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>بازیابی رمز عبور</h1>
        <p>رمز عبور جدید خود را وارد کنید</p>
        <input type="password" id="newPassword" placeholder="رمز عبور جدید" minlength="6">
        <input type="password" id="confirmPassword" placeholder="تکرار رمز عبور" minlength="6">
        <button onclick="updatePassword()">تغییر رمز عبور</button>
        <p id="message"></p>
    </div>

    <script>
        function getAccessToken() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }

        function translateError(status, errBody) {
            let code = '';
            let msg = '';

            try {
                const parsed = JSON.parse(errBody);
                code = parsed.error_code || parsed.code || '';
                msg = parsed.msg || parsed.message || '';
            } catch (e) {
                msg = errBody || '';
            }

            // Supabase error codes → Persian messages
            const translations = {
                'same_password':       'رمز عبور جدید باید با رمز عبور قبلی متفاوت باشد.',
                'weak_password':       'رمز عبور انتخابی ضعیف است. رمز قوی‌تری انتخاب کنید.',
                'validation_failed':   'اطلاعات وارد شده معتبر نیست.',
                'over_request_rate_limit': 'تعداد درخواست‌ها زیاد است. لطفاً چند دقیقه دیگر تلاش کنید.',
                'over_email_send_rate_limit': 'تعداد درخواست‌ها زیاد است. لطفاً چند دقیقه دیگر تلاش کنید.',
                'user_not_found':      'کاربری با این اطلاعات یافت نشد.',
                'email_not_confirmed': 'ایمیل شما تأیید نشده است.',
                'session_expired':     'لینک بازیابی منقضی شده است. لطفاً دوباره از برنامه درخواست دهید.',
                'token_expired':       'لینک بازیابی منقضی شده است. لطفاً دوباره از برنامه درخواست دهید.',
                'invalid_token':       'لینک بازیابی نامعتبر است. لطفاً دوباره درخواست دهید.',
                'otp_expired':         'لینک بازیابی منقضی شده است. لطفاً دوباره از برنامه درخواست دهید.',
                'reauthentication_needed': 'برای تغییر رمز عبور باید دوباره وارد شوید.',
                'password_too_short':  'رمز عبور باید حداقل ۶ کاراکتر باشد.',
                'password_too_long':   'رمز عبور بسیار طولانی است.',
                'invalid_credentials': 'اطلاعات ورود نامعتبر است.',
                'unauthorized':        'دسترسی غیرمجاز. لطفاً دوباره درخواست دهید.',
                'not_found':           'اطلاعات یافت نشد.'
            };

            if (translations[code]) {
                return translations[code];
            }

            // Fallback by HTTP status code
            if (status === 401 || status === 403) {
                return 'لینک بازیابی منقضی یا نامعتبر است. لطفاً دوباره از برنامه درخواست دهید.';
            }
            if (status === 422) {
                return 'اطلاعات وارد شده معتبر نیست. لطفاً دوباره بررسی کنید.';
            }
            if (status === 429) {
                return 'تعداد درخواست‌ها زیاد است. لطفاً چند دقیقه دیگر تلاش کنید.';
            }
            if (status >= 500) {
                return 'سرور موقتاً در دسترس نیست. لطفاً دوباره تلاش کنید.';
            }

            // Last resort: show raw msg if it's non-English (likely user-friendly)
            if (msg && !/^[A-Za-z\s\.\,]+$/.test(msg)) {
                return msg;
            }
            return 'خطا در تغییر رمز عبور. لطفاً دوباره تلاش کنید.';
        }
        async function updatePassword() {
            const token = getAccessToken();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');

            if (!token) {
                messageEl.className = 'error';
                messageEl.textContent = 'لینک نامعتبر است. لطفاً دوباره درخواست دهید.';
                return;
            }

            if (newPassword.length < 6) {
                messageEl.className = 'error';
                messageEl.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
                return;
            }

            if (newPassword !== confirmPassword) {
                messageEl.className = 'error';
                messageEl.textContent = 'رمز عبور و تکرار آن مطابقت ندارند.';
                return;
            }

            try {
                const response = await fetch('https://xpbvabrxqxhlunonigac.supabase.co/auth/v1/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'apikey': 'sb_publishable_b68jG62AzuCm0DTB8WYuUg_VrYhTMZz'
                    },
                    body: JSON.stringify({
                        password: newPassword
                    })
                });

                if (response.ok) {
                    messageEl.className = 'success';
                    messageEl.textContent = 'رمز عبور با موفقیت تغییر کرد! می‌توانید به برنامه برگردید.';
                } else {
                    const errBody = await response.text();
                    messageEl.className = 'error';
                    messageEl.textContent = translateError(response.status, errBody);
                    console.error('Reset failed:', response.status, errBody);
                }
            } catch (err) {
                messageEl.className = 'error';
                messageEl.textContent = 'ارتباط با سرور برقرار نشد. لطفاً اینترنت خود را بررسی کنید.';
                console.error('Reset error:', err);
            }
        }
    </script>
</body>
</html>
